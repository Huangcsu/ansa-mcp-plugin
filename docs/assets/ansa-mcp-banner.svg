<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">ANSA MCP Plugin</title>
  <desc id="description">Automate ANSA preprocessing tasks with AI. An AI and MCP controller coordinates geometry selection, mesh generation and model checks. The same bracket profile progresses from selected geometry to a triangular mesh and a check report, with a feedback path for result readback.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e0e9e8" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1l5 3-5 3" fill="none" stroke="#789895" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <path id="bracket" d="M0 0H88V28H44V80H0Z"/>
    <clipPath id="rounded"><rect x="1" y="1" width="1198" height="398" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1200" height="400" fill="#f4f7f6"/>
    <rect x="680" width="520" height="400" fill="url(#grid)"/>
    <path d="M0 397H1200" stroke="#315e66" stroke-width="6"/>
    <g font-family="Segoe UI,Arial,sans-serif">
      <rect x="48" y="46" width="27" height="27" rx="6" fill="#244b52"/>
      <path d="M54 64l7-11 8 11M57 60h9" fill="none" stroke="#f4f7f6" stroke-width="1.6" stroke-linejoin="round"/>
      <text x="88" y="67" fill="#315e66" font-size="22" font-weight="600">ANSA MCP Plugin</text>
      <text x="48" y="145" fill="#19393f" font-size="56" font-weight="650">Automate</text>
      <text x="48" y="207" fill="#19393f" font-size="52" font-weight="650">preprocessing tasks.</text>
      <text x="50" y="252" fill="#536968" font-size="18">AI-assisted geometry, meshing and model checks.</text>
      <g fill="#315e66" font-size="12" font-weight="600">
        <text x="50" y="324">SCRIPTABLE WORKFLOWS</text>
        <text x="286" y="324">TRACEABLE TASKS</text>
        <text x="464" y="324">RESULT READBACK</text>
      </g>
      <path d="M268 312v15M446 312v15" stroke="#bdcecb"/>
    </g>
    <g stroke-linecap="round" stroke-linejoin="round">
      <g fill="none" stroke="#a5bfba" stroke-width="1.5" marker-end="url(#arrow)">
        <path d="M934 115v28H772v21"/>
        <path d="M934 143v21"/>
        <path d="M934 143h162v21"/>
      </g>
      <path d="M1135 226h21V92h-148" fill="none" stroke="#a5bfba" stroke-width="1.4" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
      <g font-family="Segoe UI,Arial,sans-serif">
        <text x="934" y="49" text-anchor="middle" fill="#536968" font-size="11" font-weight="600">PREPROCESSING AUTOMATION</text>
        <text x="1080" y="80" text-anchor="middle" fill="#536968" font-size="10">READBACK</text>
        <rect x="874" y="69" width="120" height="46" rx="6" fill="#244b52"/>
        <g fill="none" stroke="#e8f1ee" stroke-width="1.3">
          <rect x="889" y="84" width="16" height="16" rx="2"/>
          <path d="M893 81v3M901 81v3M893 100v3M901 100v3M886 88h3M886 96h3M905 88h3M905 96h3M894 89h6v6h-6Z"/>
        </g>
        <text x="918" y="98" fill="#f4f7f6" font-size="15" font-weight="600">AI + MCP</text>
      </g>
      <g transform="translate(719 180) scale(1.15)">
        <use href="#bracket" transform="translate(5 6)" fill="#d7e4e0"/>
        <use href="#bracket" fill="#edf3f0" stroke="#315e66" stroke-width="1.6"/>
        <path d="M88 0v28H44" fill="none" stroke="#bc8951" stroke-width="2.8"/>
        <g fill="#f7ead9" stroke="#bc8951" stroke-width="1.3">
          <circle cx="88" cy="0" r="3"/>
          <circle cx="88" cy="28" r="3"/>
          <circle cx="44" cy="28" r="3"/>
        </g>
      </g>
      <g transform="translate(884 180) scale(1.15)">
        <use href="#bracket" transform="translate(5 6)" fill="#aecbc3"/>
        <use href="#bracket" fill="#c6dfda"/>
        <g fill="none" stroke="#739b92" stroke-width="0.9">
          <path d="M22 0v80M44 0v28M66 0v28M0 14h88M0 28h44M0 46h44M0 64h44"/>
          <path d="M0 0l22 14 22 14M22 0l22 14 22 14M44 0l22 14 22 14M66 0l22 14M0 14l22 14 22 18M0 28l22 18 22 18M0 46l22 18 22 16M0 64l22 16"/>
        </g>
        <use href="#bracket" fill="none" stroke="#315e66" stroke-width="1.6"/>
        <g fill="#315e66">
          <circle cx="0" cy="0" r="2"/>
          <circle cx="88" cy="0" r="2"/>
          <circle cx="44" cy="28" r="2"/>
          <circle cx="44" cy="80" r="2"/>
          <circle cx="0" cy="80" r="2"/>
        </g>
      </g>
      <g fill="none" stroke="#789895" stroke-width="1.5" marker-end="url(#arrow)">
        <path d="M837 222h32"/>
        <path d="M1002 222h32"/>
      </g>
      <g transform="translate(1050 178) scale(1.15)">
        <path d="M0 0h53l21 21v63H0Z" fill="#fbfdfc" stroke="#315e66" stroke-width="1.5"/>
        <path d="M53 0v21h21" fill="#e1eeea" stroke="#315e66" stroke-width="1.2"/>
        <g fill="none" stroke="#43836c" stroke-width="1.8">
          <path d="M12 35l4 4 7-8M12 53l4 4 7-8M12 71l4 4 7-8"/>
        </g>
        <path d="M31 35h25M31 53h25M31 71h17" fill="none" stroke="#8ca9a2" stroke-width="2"/>
      </g>
      <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
        <g fill="#315e66" font-size="12" font-weight="600">
          <text x="772" y="303">01 / GEOMETRY</text>
          <text x="937" y="303">02 / MESHING</text>
          <text x="1093" y="303">03 / MODEL CHECKS</text>
        </g>
        <g fill="#536968" font-size="12">
          <text x="772" y="325">Select entities</text>
          <text x="937" y="325">Generate mesh</text>
          <text x="1093" y="325">Verify results</text>
        </g>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="398" rx="20" fill="none" stroke="#d4dfd8"/>
</svg>
